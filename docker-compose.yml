
services:
  nginx:
    build: ./docker/nginx
    ports:
      - "443:443"
    restart: "on-failure"

  python:
    build:
      context: ./docker/backend
    command: "uvicorn main:app --reload --proxy-headers --host 0.0.0.0 --root-path /api/"
    environment:
      - TIMEOUT=600
    env_file:
      - ./app.env
    volumes:
      - ./backend:/app
      - ./data/backend:/var/lib/maskanyone/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
    env_file:
      - ./app.env
    volumes:
      - ./docker/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    build:
      context: ./docker/pgadmin
    ports:
      - "5433:443"
    environment:
      PGADMIN_ENABLE_TLS: "True"
      PGADMIN_DEFAULT_EMAIL: "dev@dev.dev"
      PGADMIN_DEFAULT_PASSWORD: "dev"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      postgres:
        condition: service_healthy

  yarn:
    build:
      context: ./docker/yarn
    command: "yarn start"
    volumes:
      - ./frontend:/app

  keycloak:
    build:
      context: ./docker/keycloak
    environment:
      KEYCLOAK_ADMIN: dev
      KEYCLOAK_ADMIN_PASSWORD: dev
    command: "start-dev"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./docker/worker
    command: "python worker.py"
    env_file:
      - ./app.env
    volumes:
      - ./worker:/app
    depends_on:
      python:
        condition: service_healthy
    restart: on-failure

  sam2:
    build:
      context: ./docker/sam2
    command: "uvicorn main:app --reload --proxy-headers --host 0.0.0.0 --root-path /api/"
    env_file:
      - ./app.env
    volumes:
      - ./sam2:/app
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MASKANYONE_GPU_ID:-0}"]
              capabilities: [ gpu ]
    # devices: # use in case the new resource reservation with GPU IDs is not working, uses GPU 0 by default
    #   - /dev/nvidia0:/dev/nvidia0
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools

  openpose:
    build:
      context: ./docker/openpose
    command: "uvicorn main:app --reload --proxy-headers --host 0.0.0.0 --root-path /api/"
    env_file:
      - ./app.env
    volumes:
      - ./openpose:/app
      - ./docker/openpose/models:/models
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MASKANYONE_GPU_ID:-0}"]
              capabilities: [ gpu ]
    # devices: # use in case the new resource reservation with GPU IDs is not working, uses GPU 0 by default
    #   - /dev/nvidia0:/dev/nvidia0
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
